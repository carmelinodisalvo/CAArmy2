<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CAArmy</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1e3a8a">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #f4f6f9;
    }

    #app-frame {
      width: 100vw;
      height: 100vh;
      /* copre eventuale notch/barra di stato su Android */
      height: 100dvh;
      border: none;
      display: block;
    }

    #fallback {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1e293b;
    }
  </style>
</head>
<body>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbwWKHzllmZh-AglGXdl7RFBtUrF-k_JtmqiHe3RaUeOkimcmjXUuaMtWsVf_6XgzGbIyw/exec"
    title="CAArmy"
    allow="fullscreen"
  ></iframe>

  <div id="fallback">
    <div>
      <p>Impossibile caricare l'app in modalità integrata.</p>
      <p><a href="https://script.google.com/macros/s/AKfycbwWKHzllmZh-AglGXdl7RFBtUrF-k_JtmqiHe3RaUeOkimcmjXUuaMtWsVf_6XgzGbIyw/exec" style="color:#1e3a8a;">Apri CAArmy</a></p>
    </div>
  </div>

  <script>
    // Se Apps Script blocca l'embedding in iframe (X-Frame-Options),
    // l'iframe resterà vuoto: mostriamo un link diretto come rete di sicurezza.
    const frame = document.getElementById('app-frame');
    const fallback = document.getElementById('fallback');

    frame.addEventListener('error', () => {
      frame.style.display = 'none';
      fallback.style.display = 'flex';
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>

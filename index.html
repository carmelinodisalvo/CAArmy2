<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Installa l'App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    /* L'overlay parte NASCOSTO: compare solo quando Chrome conferma
       che l'app è davvero installabile (evento beforeinstallprompt) */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .overlay.visible {
      display: flex;
    }

    .install-popup {
      background: #1e293b;
      border-radius: 28px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .app-icon {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      margin-bottom: 28px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
      object-fit: cover;
    }

    .install-popup h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .install-popup p {
      font-size: 16px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 36px;
    }

    .btn-install {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      padding: 18px 32px;
      font-size: 18px;
      font-weight: 600;
      border-radius: 16px;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .btn-install:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.45);
    }

    .btn-install:active {
      transform: translateY(0);
    }

    .btn-install:disabled {
      opacity: 0.6;
      cursor: default;
      transform: none;
    }

    .btn-close {
      margin-top: 20px;
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 15px;
      cursor: pointer;
      padding: 8px 16px;
    }

    .btn-close:hover {
      color: #94a3b8;
    }

    .status-message {
      display: none;
      font-size: 15px;
      color: #94a3b8;
      margin-top: 16px;
    }

    /* Schermata neutra mostrata mentre si aspetta/valuta l'installabilità,
       o su browser che non supportano il prompt nativo (es. redirect diretto) */
    .plain-loading {
      font-size: 15px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="plain-loading" id="loadingMsg">Caricamento…</div>

  <!-- POPUP DI INSTALLAZIONE (compare solo su Android/Chrome installabile) -->
  <div class="overlay" id="installOverlay">
    <div class="install-popup">
      <img src="icon-512.png" alt="Icona App" class="app-icon" onerror="this.src='https://via.placeholder.com/110x110/3b82f6/ffffff?text=APP'">

      <h1>Installa l'App</h1>
      <p>Aggiungi l'app alla schermata Home per un accesso rapido e un'esperienza migliore.</p>

      <button class="btn-install" id="installBtn">
        Installa App
      </button>

      <button class="btn-close" id="closeBtn">
        Non ora
      </button>

      <div class="status-message" id="statusMsg"></div>
    </div>
  </div>

  <script>
    // ======================
    // CONFIGURA QUI IL TUO SITO
    // ======================
    const REDIRECT_URL = "https://script.google.com/macros/s/AKfycbwWKHzllmZh-AglGXdl7RFBtUrF-k_JtmqiHe3RaUeOkimcmjXUuaMtWsVf_6XgzGbIyw/exec";
    // ======================

    let deferredPrompt = null;
    const overlay = document.getElementById('installOverlay');
    const installBtn = document.getElementById('installBtn');
    const closeBtn = document.getElementById('closeBtn');
    const statusMsg = document.getElementById('statusMsg');
    const loadingMsg = document.getElementById('loadingMsg');

    // Se è già aperta come PWA installata → vai subito al sito, niente popup
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;

    if (isStandalone) {
      window.location.replace(REDIRECT_URL);
    } else {
      // Su Android/Chrome, se l'app È installabile, questo evento scatta
      // (di solito entro pochi secondi dal caricamento pagina).
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        loadingMsg.style.display = 'none';
        overlay.classList.add('visible');
      });

      // Se dopo un breve tempo l'evento non è scattato, l'app NON è
      // installabile in questo momento (già installata, browser non
      // supportato, criteri PWA non soddisfatti, o prompt già rifiutato
      // di recente): non ha senso mostrare un popup "Installa" che non
      // farebbe nulla, quindi si passa direttamente al sito.
      setTimeout(() => {
        if (!deferredPrompt) {
          window.location.replace(REDIRECT_URL);
        }
      }, 3000);
    }

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;

      installBtn.disabled = true;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;

      statusMsg.style.display = 'block';
      statusMsg.textContent = outcome === 'accepted'
        ? 'Installazione in corso…'
        : 'Va bene, puoi installarla in un altro momento.';

      deferredPrompt = null;

      setTimeout(() => {
        overlay.classList.remove('visible');
        window.location.replace(REDIRECT_URL);
      }, outcome === 'accepted' ? 1200 : 600);
    });

    closeBtn.addEventListener('click', () => {
      overlay.classList.remove('visible');
      window.location.replace(REDIRECT_URL);
    });

    window.addEventListener('appinstalled', () => {
      overlay.classList.remove('visible');
      setTimeout(() => {
        window.location.replace(REDIRECT_URL);
      }, 800);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
